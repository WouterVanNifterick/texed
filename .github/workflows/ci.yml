name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: texed-ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: texed-ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: texed-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build

  # The web engine and the C++ rack in texed-vst are two ports of the same DSP.
  # This builds the headless renderer and replays every render-golden case
  # through both, so a change to one that is not mirrored in the other fails
  # here rather than as a report that the plugin sounds different.
  null-test:
    name: engine null test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git texed-vst/libs/JUCE
      - name: Build texed-render
        run: |
          cmake -S texed-vst -B texed-vst/build -DCMAKE_BUILD_TYPE=Release
          cmake --build texed-vst/build --target texed-render --config Release --parallel
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: texed-ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: texed-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: texed-ts
      - run: pnpm vitest run native-null
        working-directory: texed-ts

      # A DAW runs the plugin with its window closed most of the time, so the
      # document and the parameters have to carry the session on their own.
      - name: Build and run the editor-closed checks
        run: |
          cmake --build texed-vst/build --target texed-headless --config Release --parallel
          xvfb-run -a "$(find texed-vst/build -type f -name texed-headless -perm -u+x)"

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: texed-ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: texed-ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: texed-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
